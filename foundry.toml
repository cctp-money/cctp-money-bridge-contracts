[profile.default]
solc_version = "0.8.22"
src = "src"
out = "out"
libs = ["lib"]
ffi = true
via_ir = true
fs_permissions = [{ access = "read-write", path = ".forge-snapshots/"}]
remappings = [
    "solmate/=lib/solmate/src/",
]

[profile.default.overrides]
"lib/aave-v3-core" = { version = "^0.8.22" }
"lib/evm-cctp-contracts" = { version = "^0.8.22" }

[fmt]
line_length = 80

[fuzz]
runs=1000
